# Codemagic CI/CD — сборка iOS IPA для приложения Safar (Capacitor)
#
# Как это работает:
#   - По умолчанию собирается БЕЗПОДПИСНЫЙ IPA (unsigned).
#     Его можно подписать локально через Sideloadly / AltStore / esign.
#   - Если в Codemagic (App settings -> Environment variables) добавить
#     APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
#     APP_STORE_CONNECT_PRIVATE_KEY и APPLE_TEAM_ID — workflow автоматически
#     переключится на подписанную сборку App Store (нужен платный Apple Developer).
#
# Запуск: codemagic.io -> Applications -> добавить репозиторий ->
# "Set up workflow" -> выбрать ios-ipa -> Start new build.

workflows:
  ios-ipa:
    name: Safar - iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: "22"
      xcode: latest
      vars:
        BUNDLE_ID: com.safar.app
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Sync Capacitor (www -> ios/App/App/public)
        script: |
          npx cap sync ios

      - name: Set up code signing (if Apple credentials provided)
        script: |
          if [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "Apple credentials найдены - настраиваю подпись"
            keychain initialize
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
            keychain add-certificates
            xcode-project use-profiles
          else
            echo "Apple credentials не заданы - собираю БЕЗ подписи (unsigned IPA)"
          fi

      - name: Archive
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          if [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            xcodebuild archive \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/Safar.xcarchive
          else
            xcodebuild archive \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/Safar.xcarchive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          fi

      - name: Export IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          if [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            sed "s/__TEAM_ID__/${APPLE_TEAM_ID}/" ios/ExportOptions.plist > build/ExportOptions.plist
            xcodebuild -exportArchive \
              -archivePath build/Safar.xcarchive \
              -exportPath build/export \
              -exportOptionsPlist build/ExportOptions.plist
          else
            mkdir -p build/Payload
            cp -R build/Safar.xcarchive/Products/Applications/*.app build/Payload/
            cd build
            zip -qry Safar-unsigned.ipa Payload
            cd ..
          fi
          echo "--- Готовые IPA ---"
          find . -maxdepth 3 -name "*.ipa"

    artifacts:
      - build/*.ipa
